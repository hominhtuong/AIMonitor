name: Build Windows app

# Push lên main => có sẵn bản build để tải trong tab Actions.
# Đẩy tag v* => đính kèm AIMonitor.exe vào Release.
#
# PyInstaller chỉ là công cụ lúc build, không phải dependency của tool: người dùng tải
# AIMonitor.exe về là chạy, KHÔNG cần cài Python. Ràng buộc "chỉ dùng stdlib" của code
# trong aimon/ vẫn giữ nguyên.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kiểm tra cú pháp
        run: python -m compileall -q aimon windows

      - name: Cài PyInstaller
        run: pip install --disable-pip-version-check pyinstaller

      - name: Đóng gói AIMonitor.exe
        run: |
          # --paths . là bắt buộc: entry nằm trong windows/ nên PyInstaller không tự thấy
          # package aimon ở gốc repo. Thiếu nó thì nó BỎ QUA IM LẶNG, exe dựng ra vẫn
          # "thành công" nhưng rỗng ruột và chỉ chết lúc chạy.
          pyinstaller --noconfirm --clean --onefile --noconsole `
            --name AIMonitor `
            --icon assets/icon.ico `
            --paths . `
            --hidden-import aimon.server `
            --add-data "aimon/static;aimon/static" `
            --add-data "pricing.json;." `
            windows/app_win.py

      - name: Xác nhận exe có gói được code vào không
        shell: pwsh
        run: |
          # Bắt lỗi ngay tại đây thay vì để smoke test báo mơ hồ "server không khởi động"
          $warn = Get-ChildItem build/AIMonitor/warn-AIMonitor.txt -ErrorAction SilentlyContinue
          if ($warn) {
            $missing = Select-String -Path $warn.FullName -Pattern 'missing module named aimon'
            if ($missing) { $missing; throw "PyInstaller không gói được package aimon" }
          }

      - name: Chạy thử bản đã đóng gói
        shell: pwsh
        run: |
          # --no-window: chỉ bật server, không mở cửa sổ (runner không có ai nhìn)
          $p = Start-Process -FilePath dist/AIMonitor.exe -ArgumentList '--no-window' -PassThru
          $url = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            $state = "$env:USERPROFILE\.aimon\instance.json"
            if (Test-Path $state) {
              $url = (Get-Content $state -Raw | ConvertFrom-Json).url
              if ($url) { break }
            }
          }
          if (-not $url) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            # exe dựng với --noconsole nên không có stdout; app_win.py ghi lỗi ra file này
            $log = "$env:TEMP\aimon-startup-error.log"
            if (Test-Path $log) { Write-Host "--- lỗi khi khởi động ---"; Get-Content $log }
            throw "Server không khởi động được"
          }
          $v = Invoke-RestMethod "$url/api/version" -TimeoutSec 5
          Write-Host "version=$($v.version) os=$($v.os)"
          # đọc luôn snapshot: đây mới là chỗ lộ ra nếu đóng gói thiếu pricing.json / static
          $snap = Invoke-RestMethod "$url/api/snapshot" -TimeoutSec 30
          if (-not $snap.totals) { throw "Snapshot thiếu dữ liệu" }
          # Soát tên khoá, không so $null: runner sạch thì agents là mảng rỗng hợp lệ.
          $pulse = Invoke-RestMethod "$url/api/pulse" -TimeoutSec 30
          if ($pulse.PSObject.Properties.Name -notcontains 'agents') { throw "Pulse thiếu agents" }
          Invoke-WebRequest "$url/static/app.js" -TimeoutSec 5 | Out-Null
          Invoke-WebRequest "$url/static/office.js" -TimeoutSec 5 | Out-Null
          Invoke-WebRequest "$url/static/sprites.js" -TimeoutSec 5 | Out-Null
          Write-Host "OK - exe chạy được, có đủ tài nguyên"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AIMonitor-windows
          path: dist/AIMonitor.exe

      - name: Đính kèm vào Release khi đẩy tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIMonitor.exe
          body: |
            ## Windows

            Tải `AIMonitor.exe` về chạy thẳng, không cần cài Python.

            Lần đầu chạy, Windows SmartScreen sẽ hiện cảnh báo vì file chưa mua chứng chỉ ký:
            bấm **More info => Run anyway**.
