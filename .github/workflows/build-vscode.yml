name: Build VSCode extension

# Push lên main => có sẵn file .vsix để tải trong tab Actions.
# Đẩy tag v* => đính kèm .vsix vào Release VÀ publish lên VSCode Marketplace.
#
# Node và esbuild chỉ là công cụ lúc build, giống PyInstaller bên Windows: code trong
# aimon/ vẫn chỉ dùng stdlib Python. Người cài extension chỉ cần có python3 trên PATH.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'vscode-extension/**'
      - 'aimon/**'
      - 'pricing.json'
      - '.github/workflows/build-vscode.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3.9 là sàn của repo (app macOS chạy bằng /usr/bin/python3 3.9.6). Server bundle
      # trong VSIX phải chạy được ở đúng phiên bản đó, không phải phiên bản mới nhất.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - run: npm ci

      - name: Kiểm tra kiểu
        run: npx tsc --noEmit

      - name: Unit test
        run: npm test

      - name: Bộ nhân vật và bối cảnh phải khớp ở mọi nơi
        working-directory: .
        run: |
          # sprites.js / office.js / scene-*.js là nơi VẼ ra chúng; config_file.py chặn giá trị
          # rác ghi vào config; package.json dựng dropdown trong Settings. Lệch một nơi thì hoặc
          # người dùng chọn được thứ không tồn tại, hoặc thứ mới không hiện ra - cả hai lặng lẽ.
          python - <<'PY'
          import json, re, sys, glob, os
          sys.path.insert(0, '.')
          from aimon.config_file import OFFICE_PACKS, OFFICE_SCENES
          pkg = json.load(open('vscode-extension/package.json', encoding='utf-8'))
          props = pkg['contributes']['configuration']['properties']
          i18n = open('aimon/static/i18n.js', encoding='utf-8').read()

          def both_langs(key, what):
              n = i18n.count("'%s':" % key)
              assert n == 2, '%s co %d ban dich, phai co 2 (en + vi) [%s]' % (key, n, what)

          # --- bộ nhân vật ---
          js = open('aimon/static/sprites.js', encoding='utf-8').read()
          packs = re.findall(r"\{ id: '(\w+)', chars:", js)
          assert len(packs) >= 1, 'khong doc duoc bo nao tu sprites.js'
          assert sorted(packs) == sorted(OFFICE_PACKS), 'sprites.js != config_file.py'
          assert sorted(packs) == sorted(props['aimon.officePack']['enum']), 'sprites.js != package.json'
          for p in packs:
              both_langs('office.pack_%s' % p, 'bo nhan vat')

          # --- bối cảnh ---
          core0 = open('aimon/static/office.js', encoding='utf-8').read()
          files = ['aimon/static/office.js'] + sorted(glob.glob('aimon/static/scene-*.js'))
          scenes, rooms, counts = [], [], {}
          for f in files:
              src = open(f, encoding='utf-8').read()
              for m in re.finditer(r"registerScene\(\{\s*\n\s*id: '(\w+)',", src):
                  scenes.append(m.group(1))
              # Mọi `id: 'x',` viết thẳng đều là bối cảnh hoặc kiểu nền; id của chỗ làm việc
              # được ghép chuỗi (`'f' + row + ...`) nên không lọt vào đây.
              rooms += re.findall(r"^\s*id: '(\w+)',$", src, re.M)
              for m in re.finditer(r"id: '(\w+)',\n\s*stationCount: (\d+),", src):
                  counts[m.group(1)] = int(m.group(2))
          rooms = [r for r in rooms if r not in scenes]
          assert scenes, 'khong doc duoc boi canh nao'
          # SCENE_ORDER dung bay bang chon, SCENE_LAZY quyet dinh file nao nap theo yeu cau.
          # Lech thi hoac boi canh khong hien ra, hoac bam vao mot o khong bao gio tai duoc.
          order = re.search(r"const SCENE_ORDER = \[([^\]]*)\]", core0).group(1)
          order = re.findall(r"'(\w+)'", order)
          lazy = re.findall(r"\{ id: '(\w+)', src: '([^']+)' \}", core0)
          assert sorted(order) == sorted(scenes), 'SCENE_ORDER %s != boi canh %s' % (sorted(order), sorted(scenes))
          assert sorted(i for i, _ in lazy) == sorted(s for s in scenes if s != order[0]), \
              'SCENE_LAZY phai gom dung nhung boi canh KHONG nam trong office.js'
          for sid, src in lazy:
              f = 'aimon/static/' + src.split('/')[-1]
              assert os.path.exists(f), 'SCENE_LAZY tro toi file khong ton tai: ' + f
          assert sorted(scenes) == sorted(OFFICE_SCENES), 'scene js %s != config_file.py %s' % (sorted(scenes), sorted(OFFICE_SCENES))
          assert sorted(scenes) == sorted(props['aimon.officeScene']['enum']), 'scene js != package.json'
          for sc in scenes:
              both_langs('office.scene_%s' % sc, 'boi canh')
          for r in rooms:
              both_langs('office.room_%s' % r, 'kieu nen')

          # --- mỗi bối cảnh phải đủ chỗ cho MAX_AGENTS agent ---
          # Thiếu chỗ thì agent thứ N không bao giờ được chia chỗ và đứng mãi ngoài cửa, mà
          # không có gì báo. MIN_STATIONS ở office.js phải bằng MAX_AGENTS ở office.py.
          from aimon.office import MAX_AGENTS
          core = open('aimon/static/office.js', encoding='utf-8').read()
          mins = int(re.search(r'const MIN_STATIONS = (\d+);', core).group(1))
          assert mins == MAX_AGENTS, 'MIN_STATIONS %d != MAX_AGENTS %d' % (mins, MAX_AGENTS)
          for sc in scenes:
              assert sc in counts, 'boi canh %s khong khai stationCount' % sc
              assert counts[sc] >= mins, 'boi canh %s chi co %d cho, can >= %d' % (sc, counts[sc], mins)

          print('%d bo, %d boi canh, %d kieu nen, khop va du 2 ban dich' % (len(packs), len(scenes), len(rooms)))
          PY

      - name: Đóng gói .vsix
        run: npm run package

      - name: Soát nội dung gói
        run: |
          vsix=$(ls *.vsix)
          echo "gói: $vsix"
          files=$(unzip -Z1 "$vsix")

          # Thiếu bất kỳ thứ nào dưới đây thì extension vẫn cài được nhưng chết lúc chạy
          # hoặc lên store thiếu thông tin, nên bắt ngay tại đây.
          for f in extension/dist/extension.js extension/pricing.json \
                   extension/aimon/server.py extension/aimon/office.py \
                   extension/aimon/static/app.js \
                   extension/aimon/static/office.js extension/aimon/static/sprites.js \
                   extension/aimon/static/packimport.js \
                   extension/aimon/static/scene-farm.js \
                   extension/aimon/static/scene-delivery.js \
                   extension/aimon/static/scene-farm-v2.js \
                   extension/aimon/static/sprites-farm.js \
                   extension/media/icon.svg extension/images/icon.png \
                   extension/README.md extension/CHANGELOG.md extension/LICENSE.txt; do
            echo "$files" | grep -qx "$f" || { echo "THIẾU $f"; exit 1; }
          done

          # Rác không được lọt: .pyc biên dịch cho Python của máy build, và source .ts
          # (đã bundle vào dist/extension.js rồi).
          if echo "$files" | grep -E '__pycache__|\.pyc$|\.ts$|\.map$'; then
            echo "Có file rác trong gói"
            exit 1
          fi
          echo "OK - gói đủ và sạch"

      # Chạy thật server đã bundle: đây mới là chỗ lộ ra nếu copy-aimon.js thiếu
      # pricing.json hay static/, chứ /api/version thì thiếu gì cũng vẫn trả 200.
      - name: Chạy thử server trong gói
        env:
          # Mô phỏng đúng môi trường extension tạo ra: stdout KHÔNG phải console UTF-8.
          # Không có biến này thì runner chạy sẵn UTF-8 và CI bỏ lọt cả một lớp lỗi - đúng
          # cách bản 1.2.3 lọt ra tới người dùng: server chết ngay ở `print` tiếng Việt đầu
          # tiên với UnicodeEncodeError, mà CI vẫn xanh.
          PYTHONIOENCODING: cp1252
        run: |
          vsix=$(ls *.vsix)
          rm -rf /tmp/vsix-check && mkdir -p /tmp/vsix-check
          unzip -q "$vsix" -d /tmp/vsix-check
          cd /tmp/vsix-check/extension
          python -m aimon.server --port 0 --new > /tmp/aimon-server.log 2>&1 &
          url=""
          for i in $(seq 1 30); do
            sleep 1
            if [ -f "$HOME/.aimon/instance.json" ]; then
              url=$(python -c "import json;print(json.load(open('$HOME/.aimon/instance.json'))['url'])" 2>/dev/null || true)
              [ -n "$url" ] && break
            fi
          done
          if [ -z "$url" ]; then
            echo "--- log server ---"; cat /tmp/aimon-server.log
            exit 1
          fi
          echo "url=$url"
          curl -fsS "$url/api/version" | head -c 300; echo
          curl -fsS "$url/static/app.js" -o /dev/null
          curl -fsS "$url/static/office.js" -o /dev/null
          curl -fsS "$url/static/sprites.js" -o /dev/null
          # totals rỗng nghĩa là pricing.json không nằm đúng chỗ claude.py đi tìm
          curl -fsS "$url/api/snapshot" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('totals'), 'snapshot thiếu totals'; print('totals OK')"
          # Khung nhìn Văn phòng: phải có khoá `agents`, kể cả khi máy build không chạy AI
          # nào (lúc đó là danh sách rỗng). Thiếu hẳn khoá nghĩa là office.py hỏng.
          curl -fsS "$url/api/pulse" \
            | python -c "import json,sys; d=json.load(sys.stdin); assert 'agents' in d, 'pulse thiếu agents'; print('pulse OK')"
          # Tắt qua /api/quit chứ không kill: chính đường extension dùng, và là cách duy
          # nhất dọn được instance.json trên Windows.
          curl -fsS -X POST "$url/api/quit" -o /dev/null
          sleep 2
          if [ -f "$HOME/.aimon/instance.json" ]; then
            echo "instance.json không được dọn sau /api/quit"; exit 1
          fi
          echo "OK - tắt êm, state đã dọn"

      - uses: actions/upload-artifact@v4
        with:
          name: AIMonitor-vscode
          path: vscode-extension/*.vsix

  # Token Marketplace hết hạn tối đa sau 1 năm, và chọn sai scope/organization lúc tạo là
  # chuyện rất hay xảy ra. Kiểm tra ngay trên main để biết trước, thay vì phát hiện giữa lúc
  # đẩy tag - lúc đó Release đã tạo rồi mà extension thì chưa lên store.
  # Không chạy cho pull_request: PR từ fork không đọc được secret.
  check-pat:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Bỏ qua khi chưa có VSCE_PAT
        if: env.VSCE_PAT == ''
        run: echo "::notice::Chưa có secret VSCE_PAT - bỏ qua bước kiểm tra token."

      - name: Kiểm tra token publish còn dùng được
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@2 verify-pat mituultra

  # Chạy đúng file .vsix mà job build vừa tạo, trên Windows thật. Đây là chỗ duy nhất bắt được
  # các lỗi chỉ có ở Windows: tên binary Python, alias Microsoft Store, dọn state.
  windows-check:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Unit test trên Windows
        working-directory: vscode-extension
        run: |
          npm ci
          npm test

      - uses: actions/download-artifact@v4
        with:
          name: AIMonitor-vscode
          path: vsix

      - name: Chạy thử server trong gói trên Windows
        shell: pwsh
        env:
          # Đây mới là điều kiện thật của extension: stdout bị chuyển hướng đi chỗ khác nên
          # Python dùng code page của hệ chứ không phải UTF-8. Bản 1.2.3 chết đúng ở đây
          # (UnicodeEncodeError khi in tiếng Việt) mà CI vẫn xanh vì runner để sẵn UTF-8 và
          # bước này không chuyển hướng stdout.
          PYTHONIOENCODING: cp1252
        run: |
          $vsix = (Get-ChildItem vsix/*.vsix)[0].FullName
          Expand-Archive -Path $vsix -DestinationPath vsix-extracted -Force
          Push-Location vsix-extracted/extension
          $p = Start-Process -FilePath python -ArgumentList '-m','aimon.server','--port','0','--new' `
                             -PassThru -RedirectStandardOutput "$env:TEMP\aimon-out.log" `
                             -RedirectStandardError "$env:TEMP\aimon-err.log"
          $state = "$env:USERPROFILE\.aimon\instance.json"
          $url = $null
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            if (Test-Path $state) {
              $url = (Get-Content $state -Raw | ConvertFrom-Json).url
              if ($url) { break }
            }
          }
          if (-not $url) {
            Write-Host "--- stderr server ---"
            if (Test-Path "$env:TEMP\aimon-err.log") { Get-Content "$env:TEMP\aimon-err.log" }
            Write-Host "--- stdout server ---"
            if (Test-Path "$env:TEMP\aimon-out.log") { Get-Content "$env:TEMP\aimon-out.log" }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "Server trong gói không khởi động được trên Windows"
          }
          Write-Host "url=$url"
          Invoke-RestMethod "$url/api/version" -TimeoutSec 5 | ConvertTo-Json -Compress | Write-Host
          Invoke-WebRequest "$url/static/app.js" -TimeoutSec 5 | Out-Null
          Invoke-WebRequest "$url/static/office.js" -TimeoutSec 5 | Out-Null
          Invoke-WebRequest "$url/static/sprites.js" -TimeoutSec 5 | Out-Null
          $snap = Invoke-RestMethod "$url/api/snapshot" -TimeoutSec 30
          if (-not $snap.totals) { throw "Snapshot thiếu totals - pricing.json không đúng chỗ" }
          # /api/pulse gọi PowerShell + CIM qua proc_util để liệt kê tiến trình - đây là chỗ
          # lộ ra nếu đường đó hỏng riêng trên Windows.
          # Soát TÊN KHOÁ chứ không so $null: runner không chạy AI nào nên agents là mảng
          # rỗng, mà PowerShell coi mảng rỗng gần như $null tuỳ ngữ cảnh - so kiểu đó thì
          # job đỏ vì máy build sạch, không phải vì code hỏng.
          $pulse = Invoke-RestMethod "$url/api/pulse" -TimeoutSec 30
          if ($pulse.PSObject.Properties.Name -notcontains 'agents') { throw "Pulse thiếu agents" }

          # Đây là lý do job này tồn tại: trên Windows, giết tiến trình KHÔNG chạy khối
          # finally của server.py nên instance.json ở lại. Extension vì thế gọi /api/quit.
          Invoke-RestMethod -Method Post "$url/api/quit" -TimeoutSec 5 | Out-Null
          Start-Sleep -Seconds 3
          if (Test-Path $state) { throw "instance.json không được dọn sau /api/quit" }
          Write-Host "OK - Windows chạy được và tắt êm, state đã dọn"
          Pop-Location

  # Cùng một file .vsix, chạy trên macOS. KHÔNG dùng setup-python ở đây: bản Python quan
  # trọng với repo này là /usr/bin/python3 (3.9.6) - thứ duy nhất chắc chắn có mặt trên máy
  # người dùng macOS, và cũng là thứ app macOS dùng. setup-python sẽ cài một Python khác rồi
  # kiểm tra nhầm sang nó. macos-14 là runner Apple Silicon.
  macos-check:
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIMonitor-vscode
          path: vsix

      - name: Chạy thử server trong gói bằng /usr/bin/python3
        env:
          PYTHONIOENCODING: cp1252  # xem giải thích ở job build
        run: |
          /usr/bin/python3 --version
          vsix=$(ls vsix/*.vsix)
          rm -rf extracted && mkdir extracted
          unzip -q "$vsix" -d extracted
          cd extracted/extension
          /usr/bin/python3 -m aimon.server --port 0 --new > /tmp/aimon-macos.log 2>&1 &
          state="$HOME/.aimon/instance.json"
          url=""
          for i in $(seq 1 30); do
            sleep 1
            if [ -f "$state" ]; then
              url=$(/usr/bin/python3 -c "import json;print(json.load(open('$state'))['url'])" 2>/dev/null || true)
              [ -n "$url" ] && break
            fi
          done
          if [ -z "$url" ]; then
            echo "--- log server ---"; cat /tmp/aimon-macos.log
            exit 1
          fi
          echo "url=$url"
          curl -fsS "$url/api/version"; echo
          curl -fsS "$url/static/app.js" -o /dev/null
          curl -fsS "$url/static/office.js" -o /dev/null
          curl -fsS "$url/static/sprites.js" -o /dev/null
          curl -fsS "$url/api/snapshot" \
            | /usr/bin/python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('totals'), 'snapshot thiếu totals'; print('totals OK')"
          curl -fsS "$url/api/pulse" \
            | /usr/bin/python3 -c "import json,sys; d=json.load(sys.stdin); assert 'agents' in d, 'pulse thiếu agents'; print('pulse OK')"
          curl -fsS -X POST "$url/api/quit" -o /dev/null
          sleep 2
          if [ -f "$state" ]; then
            echo "instance.json không được dọn sau /api/quit"
            exit 1
          fi
          echo "OK - macOS chạy được và tắt êm, state đã dọn"

  release:
    needs: [build, windows-check, macos-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Context `secrets` KHÔNG dùng được trong `if` của step (GitHub chỉ cho github/env/needs/
    # ...), nên map sang env ở cấp job rồi mới kiểm tra `env.X != ''`.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AIMonitor-vscode
          path: vsix

      - name: Đính kèm vào Release
        uses: softprops/action-gh-release@v2
        with:
          files: vsix/*.vsix
          body: |
            ## VSCode

            Cài từ Marketplace: tìm **AI Monitor** trong tab Extensions, hoặc

            ```bash
            code --install-extension mituultra.aimonitor
            ```

            File `.vsix` bên dưới dành cho ai cần cài offline.

            Cần có `python3` trên PATH. Extension không kèm Python.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Publish CHÍNH file .vsix vừa được hai job trên kiểm tra, không build lại - build lại
      # là phát hành thứ chưa ai chạy thử.
      - name: Publish lên VSCode Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@2 publish --packagePath $(ls vsix/*.vsix)

      - name: Cảnh báo khi chưa có VSCE_PAT
        if: env.VSCE_PAT == ''
        run: |
          echo "::warning::Chưa đặt secret VSCE_PAT nên KHÔNG publish lên Marketplace. Release chỉ có file .vsix."
          echo "Chưa publish lên Marketplace: thiếu secret \`VSCE_PAT\`." >> "$GITHUB_STEP_SUMMARY"

      # Open VSX là store của VSCodium/Cursor/Windsurf - cùng file .vsix, khác nơi đăng.
      # Bỏ qua nếu chưa có token. ovsx tự đọc biến môi trường OVSX_PAT.
      - name: Publish lên Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx publish $(ls vsix/*.vsix)
