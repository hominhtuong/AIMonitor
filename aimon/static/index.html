<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!-- Mọi chữ hiển thị đều đi qua data-i18n; app.js đổ nội dung theo ngôn ngữ đang chọn.
     Đừng viết chữ thẳng vào đây, nếu không nó sẽ không dịch được. -->
<header>
  <div class="hd">
    <div class="brand">
      <img src="/favicon.svg" alt="AI Monitor">
      <div class="who">
        <h1>AI Monitor</h1>
        <span class="tag" data-i18n="hdr.tagline"></span>
      </div>
    </div>

    <div class="meter">
      <div class="lbl"><span data-i18n="hdr.ram_sys"></span><span id="mem-txt">-</span></div>
      <div class="bar" id="mem-bar"><i style="width:0"></i></div>
    </div>

    <div class="meter">
      <div class="lbl"><span data-i18n="hdr.ram_ai"></span><span id="ai-txt">-</span></div>
      <div class="bar g" id="ai-bar"><i style="width:0"></i></div>
    </div>

    <!-- Cùng hàng với 2 thanh RAM. Để trong ô đo thì ô đó cao hơn ô kia và hai thanh
         lệch nhau, nên tách hẳn ra ngoài. Load average + số lõi nằm ở tooltip. -->
    <span id="load" class="tag procs"></span>

    <!-- Gom thành một cụm để khi cửa sổ hẹp thì cả cụm xuống hàng và vẫn dồn về phải,
         thay vì từng nút rơi lẻ ra góc trái. Cờ nằm ngoài cùng bên phải. -->
    <div class="ctl">
      <!-- chỉ hiện khi có trục trặc (mất kết nối, đã dừng), lúc bình thường ẩn đi -->
      <span id="stamp" class="tag alert" hidden></span>
      <select id="interval" data-i18n-title="hdr.interval">
        <option value="1000" data-i18n="hdr.every_1s"></option>
        <option value="2000" data-i18n="hdr.every_2s"></option>
        <option value="3000" selected data-i18n="hdr.every_3s"></option>
        <option value="5000" data-i18n="hdr.every_5s"></option>
        <option value="10000" data-i18n="hdr.every_10s"></option>
        <option value="0" data-i18n="hdr.every_off"></option>
      </select>
      <button id="refresh" data-i18n="hdr.refresh"></button>
      <!-- Đổi sáng/tối. Vỏ nhúng (extension VSCode) truyền ?theme= nên nút này ẩn đi ở đó,
           để dashboard luôn bám theo theme của editor thay vì có hai nguồn quyết định. -->
      <button id="theme" data-i18n-title="hdr.theme"></button>
      <button id="quit" data-i18n="hdr.quit" data-i18n-title="hdr.quit_hint"></button>
      <!-- Tên ngôn ngữ luôn viết bằng chính ngôn ngữ đó, không dịch theo giao diện:
           người đang xem tiếng Anh vẫn phải nhận ra dòng "Tiếng Việt" là của mình. -->
      <select id="lang" data-i18n-title="hdr.language">
        <option value="en">&#127482;&#127480;&nbsp; English</option>
        <option value="vi">&#127483;&#127475;&nbsp; Tiếng Việt</option>
      </select>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="usage" id="usage"></div>
  <div class="kpis" id="kpis"></div>
  <div class="chips" id="chips"></div>

  <div class="tabs">
    <button data-tab="ai" class="on" data-i18n="tab.ai"></button>
    <button data-tab="office" data-i18n="tab.office"></button>
    <button data-tab="hist" data-i18n="tab.hist"></button>
    <button data-tab="res" data-i18n="tab.res"></button>
    <button data-tab="net" data-i18n="tab.net"></button>
  </div>

  <!-- Bộ lọc loại agent. Nằm DƯỚI thanh tab và chỉ hiện ở hai tab nó thật sự tác động
       (AI & Agent, Văn phòng). Để phía trên thanh tab thì trông như nó lọc cả trang, kể cả
       Lịch sử phiên và Cổng & Docker - hai chỗ nó không đụng tới.
       Vẫn là MỘT bộ lọc dùng chung cho hai tab đó: cùng một danh sách agent nhìn hai kiểu,
       tách làm hai giá trị riêng thì đổi ở tab này xong sang tab kia thấy số khác, không ai
       hiểu vì sao. Nội dung do app.js dựng. -->
  <div class="kindbar" id="kindbar" hidden></div>

  <section class="pane on" id="pane-ai">
    <h2 data-i18n="ai.title"></h2>
    <p class="hint" data-i18n="ai.hint"></p>
    <div id="live"></div>

    <div class="h2row">
      <h2 data-i18n="ai.closed_title"></h2>
      <select id="closed-range" data-i18n-title="common.range">
        <option value="today" selected data-i18n="common.today"></option>
        <option value="7d" data-i18n="common.7d"></option>
      </select>
      <span class="hint" style="margin:0" data-i18n="ai.closed_hint"></span>
    </div>
    <div id="closed"></div>
  </section>

  <section class="pane" id="pane-office">
    <div class="h2row">
      <h2 data-i18n="office.title"></h2>
      <span class="tag" id="office-count"></span>
      <!-- Chỉ hiện sân khấu: ẩn hết phần còn lại của trang, để lại đúng khung hình. Trở về
           bằng cách bấm vào một nhân vật, bấm nút nổi ở góc, hoặc phím Esc. -->
      <button id="office-solo" class="mini" aria-pressed="false"
              data-i18n="office.solo" data-i18n-title="office.solo_hint"></button>
      <span class="hint" style="margin:0" data-i18n="office.hint"></span>
    </div>
    <!-- Canvas phải nằm NGOÀI mọi vùng do render()/morph() cập nhật. Nếu không thì cứ mỗi
         lần làm mới nó bị thay bằng canvas mới: mất context, nhân vật nhảy về vị trí đầu.
         Chỉ #office-detail bên dưới là vùng động. -->
    <div class="office-stage"><canvas id="office-canvas"></canvas></div>
    <!-- Lối ra dự phòng của chế độ chỉ hiện sân khấu. Bấm nhân vật mới là đường chính, nhưng
         phòng có lúc không có ai - không có nút này thì người dùng kẹt lại, mà lựa chọn đó
         còn được nhớ qua lần mở sau. Nằm NGOÀI .office-stage và position:fixed nên không
         dính vào cuộn ngang của khung hình. -->
    <button id="office-solo-exit" data-i18n="office.solo_exit"
            data-i18n-title="office.solo_exit_hint"></button>
    <!-- Bảng chọn nhân vật. Mỗi ô là một canvas nhỏ vẽ thẳng từ sprites.js, không phải ảnh -
         xem mẫu phải là chính hình sẽ dùng, không phải một bản mô phỏng dễ lệch. Nằm ngoài
         vùng morph() giống canvas chính, vì mỗi ô giữ context riêng. -->
    <!-- Bối cảnh đứng TRƯỚC kiểu nền: nền là lựa chọn bên trong một bối cảnh, đổi bối cảnh
         là danh sách nền đổi theo. Xếp ngược lại thì người dùng chọn nền xong mới thấy nó
         biến mất vì vừa đổi bối cảnh. -->
    <details class="skinbox" id="office-scenebox">
      <summary data-i18n="office.scene_pick"></summary>
      <div class="skins" id="office-scenes"></div>
    </details>
    <details class="skinbox" id="office-roombox">
      <summary data-i18n="office.room_pick"></summary>
      <div class="skins" id="office-rooms"></div>
    </details>
    <details class="skinbox" id="office-skinbox">
      <summary data-i18n="office.pack_pick"></summary>
      <div class="skins" id="office-skins"></div>
      <p class="hint" data-i18n="import.privacy"></p>
      <!-- Ảnh chỉ được đọc bằng FileReader ở ngay trong trang, không upload đi đâu. -->
      <input type="file" id="office-file" accept="image/*" hidden>
    </details>
    <div class="office-legend" id="office-legend"></div>
    <div id="office-detail"></div>
  </section>

  <section class="pane" id="pane-hist">
    <h2 data-i18n="hist.title"></h2>
    <p class="hint" data-i18n-html="hist.hint"></p>
    <div class="toolbar">
      <select id="hist-range" data-i18n-title="common.range">
        <option value="7" data-i18n="common.7d"></option>
        <option value="30" data-i18n="common.30d"></option>
        <option value="90" data-i18n="common.90d"></option>
        <option value="all" selected data-i18n="common.all"></option>
      </select>
      <select id="hist-sort" data-i18n-title="hist.sort">
        <option value="cost" selected data-i18n="hist.sort_cost"></option>
        <option value="token" data-i18n="hist.sort_token"></option>
        <option value="msgs" data-i18n="hist.sort_msgs"></option>
        <option value="recent" data-i18n="hist.sort_recent"></option>
      </select>
      <input type="text" id="hist-filter" data-i18n-placeholder="hist.filter">
      <button id="hist-reload" data-i18n="hist.rescan"></button>
      <span class="tag" id="hist-meta"></span>
    </div>

    <div class="kpis" id="hist-kpis"></div>

    <div class="h2row"><h2 data-i18n="hist.by_project"></h2>
      <span class="hint" style="margin:0" data-i18n="hist.by_project_hint"></span>
    </div>
    <div id="hist-proj"></div>

    <div class="h2row"><h2 data-i18n="hist.by_session"></h2><span class="tag" id="hist-count"></span></div>
    <div id="hist-sess"></div>
  </section>

  <section class="pane" id="pane-res">
    <h2 data-i18n="res.title"></h2>
    <div class="toolbar">
      <input type="text" id="filter" data-i18n-placeholder="res.filter">
      <label class="chk"><input type="checkbox" id="mine" checked> <span data-i18n="res.mine"></span></label>
      <label class="chk"><input type="checkbox" id="aionly"> <span data-i18n="res.ai_only"></span></label>
      <span class="tag" id="res-count"></span>
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th data-i18n="col.pid"></th><th data-i18n="col.name"></th><th data-i18n="col.kind"></th>
        <th class="num" data-i18n="col.ram"></th><th class="num" data-i18n="col.cpu"></th>
        <th class="num" data-i18n="col.uptime"></th><th data-i18n="col.actions"></th>
      </tr></thead>
      <tbody id="res-body"></tbody>
    </table></div>
  </section>

  <section class="pane" id="pane-net">
    <h2 data-i18n="net.title"></h2>
    <div class="tbl-wrap"><table>
      <thead><tr>
        <th class="num" data-i18n="col.port"></th><th data-i18n="col.address"></th>
        <th data-i18n="col.pid"></th><th data-i18n="col.process"></th>
        <th data-i18n="col.note"></th><th data-i18n="col.actions"></th>
      </tr></thead>
      <tbody id="port-body"></tbody>
    </table></div>

    <h2 data-i18n="net.docker"></h2>
    <div id="docker"></div>
  </section>

  <div class="foot"><span data-i18n="foot.text"></span> · <span id="ver"></span></div>
</div>

<div id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true">
    <h3 id="m-title"></h3>
    <p id="m-body"></p>
    <div class="warnline" id="m-warn" hidden></div>
    <div class="row">
      <button id="m-cancel" data-i18n="common.cancel"></button>
      <button id="m-ok" class="primary" data-i18n="common.confirm"></button>
    </div>
  </div>
</div>

<div id="toast"></div>
<!-- Nạp TRƯỚC app.js: trang biết theme ngay lúc dựng, không vẽ nền tối rồi mới
     nháy sang nền sáng. Nội dung do server sinh từ ~/.aimon/config.json. -->
<script src="/api/config.js"></script>
<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
<!-- Nạp SAU app.js: office.js dùng lại t(), render(), esc(), kidRow() và S.snap của nó. -->
<script src="/static/sprites.js"></script>
<script src="/static/packimport.js"></script>
<!-- scene-farm.js và scene-delivery.js KHÔNG khai ở đây: office.js tự kéo chúng về khi cần
     (bối cảnh đã chọn lúc dựng trang, hoặc lúc người dùng mở bảng chọn bối cảnh). Ai chỉ dùng
     bối cảnh Văn phòng thì không tải một byte nào của hai file đó. -->
<script src="/static/office.js"></script>
</body>
</html>
